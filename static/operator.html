<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator paneli</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="ikat" aria-hidden="true"></div>
  <header class="bar" style="max-width:1040px">
    <a class="brand" href="/" data-t="brand">Qabul yordamchisi</a>
    <nav class="nav">
      <a href="/" data-t="nav_patient">Murojaat</a>
      <a href="/stats" data-t="nav_stats">Statistika</a>
      <div class="lang" role="group" aria-label="Til / Язык">
        <button type="button" data-lang="uz">O'zb</button><button type="button" data-lang="ru">Рус</button>
      </div>
    </nav>
  </header>

  <main class="wide">
    <section id="login" class="login" hidden>
      <h1 data-t="login_title">Operator paneli</h1>
      <form id="login-form">
        <label for="pw" data-t="password">Parol</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit" data-t="login">Kirish</button>
        <p class="error" id="login-error" role="alert" hidden></p>
      </form>
    </section>

    <section id="panel" hidden>
      <h1 data-t="login_title">Operator paneli</h1>
      <div class="toolbar">
        <div class="seg" role="group">
          <button type="button" id="f-pending" aria-pressed="true" data-t="pending">Kutilmoqda</button>
          <button type="button" id="f-all" aria-pressed="false" data-t="all">Hammasi</button>
        </div>
        <button class="btn ghost" type="button" id="refresh" data-t="refresh">Yangilash</button>
        <span class="spacer"></span>
        <a class="btn ghost" href="/api/export.csv" data-t="export">CSV yuklab olish</a>
        <button class="btn ghost" type="button" id="logout" data-t="logout">Chiqish</button>
      </div>
      <div id="cases" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/operator.js"></script>
</body>
</html>
