<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qabul yordamchisi</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="patient">
  <div class="ikat" aria-hidden="true"></div>
  <header class="bar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span data-t="brand">Qabul yordamchisi</span></a>
    <nav class="nav">
      <a href="/operator" data-t="nav_operator">Operator</a>
      <div class="lang" role="group" aria-label="Til / Язык">
        <button type="button" data-lang="uz">O'zb</button><button type="button" data-lang="ru">Рус</button>
      </div>
    </nav>
  </header>

  <main class="patient-main">
    <section class="hero" id="hero">
      <h1 id="title" data-t="h1">Nima bezovta qilyapti?</h1>
      <p class="lead" data-t="lead"></p>
    </section>

    <form id="form" class="composer">
      <textarea id="complaint" aria-labelledby="title" data-t-ph="placeholder" maxlength="1500" required></textarea>
      <div class="composer-foot">
        <span class="counter" id="counter" aria-live="off">0 / 1500</span>
        <button class="btn" id="submit" type="submit" data-t="submit">Bo'limni aniqlash</button>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <section class="areas" id="areas" aria-labelledby="areas-title">
      <h2 id="areas-title" data-t="area_title">Qayeringiz bezovta qilyapti?</h2>
      <p class="areas-hint" data-t="area_hint"></p>
      <div class="area-grid" id="area-grid"></div>
    </section>

    <section class="summary" id="summary" hidden>
      <div>
        <p class="summary-label" data-t="your_complaint">Sizning murojaatingiz</p>
        <p class="summary-text" id="summary-text"></p>
      </div>
      <button class="btn ghost small" id="reset" type="button" data-t="reset">Yangi murojaat</button>
    </section>

    <section class="result" id="result" aria-live="polite"></section>

    <aside class="footnote">
      <p class="sos"><span class="sos-num">103</span><span data-t="sos">Ahvol og'ir bo'lsa, kutmang — tez yordam chaqiring</span></p>
      <p class="note" data-t="note"></p>
    </aside>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
